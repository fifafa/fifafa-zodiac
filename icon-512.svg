<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1240"/>
      <stop offset="100%" stop-color="#070510"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(200,166,74,0.15)"/>
      <stop offset="100%" stop-color="rgba(200,166,74,0)"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="85" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#c8a64a" stroke-width="2.5" opacity="0.25"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#c8a64a" stroke-width="2" opacity="0.2" stroke-dasharray="15 20"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#c8a64a" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="20" fill="#c8a64a" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Star rays -->
  <g opacity="0.5">
    <line x1="256" y1="256" x2="320" y2="130" stroke="#ede4d0" stroke-width="2"/>
    <line x1="256" y1="256" x2="380" y2="230" stroke="#ede4d0" stroke-width="1.5"/>
    <line x1="256" y1="256" x2="130" y2="155" stroke="#ede4d0" stroke-width="1.8"/>
    <line x1="256" y1="256" x2="155" y2="370" stroke="#ede4d0" stroke-width="1.5"/>
    <line x1="256" y1="256" x2="345" y2="345" stroke="#ede4d0" stroke-width="1.2"/>
  </g>
  <!-- Small stars -->
  <circle cx="110" cy="130" r="6" fill="#c8a64a" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="145" r="5" fill="#c8a64a" opacity="0.5">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="320" r="4.5" fill="#ede4d0" opacity="0.4"/>
  <circle cx="410" cy="345" r="5.5" fill="#c8a64a" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
