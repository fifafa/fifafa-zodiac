<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>福临阁 · 每日黄历</title>
<meta name="description" content="每日黄历·生肖运势·八字简批——你的贴心老黄历">
<meta name="theme-color" content="#f5f0e8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23c43a31'/><text x='16' y='24' text-anchor='middle' font-size='20'>福</text></svg>">
<style>
:root{
  --bg:#f5f0e8;
  --card:#fffef9;
  --red:#c43a31;
  --gold:#b8860b;
  --gold2:#d4a843;
  --text:#3d3226;
  --text2:#7a6e5c;
  --text3:#a69880;
  --green:#4a7c59;
  --blue:#5b7a8a;
  --r:16px;--r2:24px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'PingFang SC','Microsoft YaHei','Noto Serif SC',Georgia,serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;
  -webkit-tap-highlight-color:transparent;font-size:18px;line-height:1.8;
  background-image:radial-gradient(ellipse at 50% 10%,rgba(196,58,49,0.03) 0%,transparent 60%);
}
::selection{background:rgba(196,58,49,0.15);color:var(--red)}

/* Header */
.header{
  text-align:center;padding:28px 20px 18px;
  background:linear-gradient(180deg,rgba(196,58,49,0.06) 0%,transparent 100%);
}
.header .brand{font-size:30px;font-weight:700;color:var(--red);letter-spacing:.15em}
.header .sub{font-size:16px;color:var(--text3);margin-top:4px;letter-spacing:.1em}
.header .today-lunar{font-size:22px;color:var(--gold);margin-top:8px;font-weight:600}

/* Cards */
.card{
  background:var(--card);border-radius:var(--r2);padding:24px 20px;margin:12px 16px;
  box-shadow:0 2px 12px rgba(180,160,130,0.08);
  border:1px solid rgba(180,160,130,0.12);
}
.card-title{
  font-size:20px;font-weight:700;color:var(--red);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.card-title .icon{font-size:24px}

/* 黄历 */
.huangli-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.huangli-item{
  background:rgba(196,58,49,0.03);border-radius:var(--r);padding:14px 10px;
}
.huangli-item .hl-label{font-size:16px;color:var(--text3);margin-bottom:4px}
.huangli-item .hl-val{font-size:22px;color:var(--text);font-weight:600}
.huangli-item.auspicious .hl-val{color:var(--green)}
.huangli-item.inauspicious .hl-val{color:var(--red)}

.yi-ji{margin-top:14px}
.yi-ji .label{font-size:18px;font-weight:700;margin-bottom:8px}
.yi-ji .items{display:flex;flex-wrap:wrap;gap:6px}
.yi-ji .tag{padding:6px 14px;border-radius:20px;font-size:17px;line-height:1.6}
.yi .label{color:var(--green)}
.yi .tag{background:rgba(74,124,89,0.08);color:var(--green);border:1px solid rgba(74,124,89,0.2)}
.ji .label{color:var(--red)}
.ji .tag{background:rgba(196,58,49,0.06);color:var(--red);border:1px solid rgba(196,58,49,0.12)}
.daily-tip{margin-top:16px;padding:16px;background:rgba(184,134,11,0.05);border-radius:var(--r);
  text-align:center;font-size:18px;color:var(--gold);border:1px solid rgba(184,134,11,0.12);line-height:1.8}

/* Zodiac */
.zodiac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.zodiac-item{
  text-align:center;padding:12px 6px;border-radius:var(--r);cursor:pointer;transition:.2s;
  background:rgba(180,160,130,0.04);border:1px solid transparent;
}
.zodiac-item:hover,.zodiac-item.on{background:rgba(196,58,49,0.06);border-color:rgba(196,58,49,0.15)}
.zodiac-item .z-emoji{font-size:28px}
.zodiac-item .z-name{font-size:15px;color:var(--text2);margin-top:4px}
.zodiac-detail{margin-top:16px;padding-top:16px;border-top:1px solid rgba(180,160,130,0.15)}
.zodiac-detail .zd-name{font-size:24px;font-weight:700;color:var(--red);text-align:center;margin-bottom:12px}
.zodiac-detail .zd-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(180,160,130,0.1);font-size:18px}
.zodiac-detail .zd-star{color:var(--gold2);letter-spacing:.15em}
.zodiac-detail .zd-advice{text-align:center;margin-top:14px;font-size:18px;color:var(--text2);line-height:1.8}

/* BaZi form */
.fg{margin-bottom:16px}
.fg label{display:block;font-size:18px;color:var(--text2);margin-bottom:6px;font-weight:600}
.dr{display:flex;gap:6px}
.dr select{flex:1;text-align:center;text-align-last:center}
select{
  width:100%;padding:14px 16px;font-size:18px;border-radius:var(--r);border:1px solid rgba(180,160,130,0.25);
  background:var(--card);color:var(--text);appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23a69880' stroke-width='1.5' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;font-family:inherit;
}
select:focus{outline:none;border-color:var(--red)}

.btn{
  display:block;width:100%;padding:18px;font-size:22px;font-weight:700;border-radius:var(--r2);
  border:none;cursor:pointer;transition:.25s;font-family:inherit;letter-spacing:.08em;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:active{background:#a8322a;transform:scale(.98)}
.btn-wide{margin:0 16px;width:calc(100% - 32px)}

.bazi-result{margin-top:16px}
.pillars{display:flex;gap:6px;margin:16px 0}
.pillar{flex:1;text-align:center;background:rgba(196,58,49,0.03);border-radius:var(--r);padding:14px 6px}
.pillar .pl{font-size:15px;color:var(--text3);margin-bottom:4px}
.pillar .ps{font-size:32px;color:var(--red);font-weight:700;line-height:1.4}
.pillar .pb{font-size:22px;color:var(--text);line-height:1.4}
.pillar .pss{font-size:15px;color:var(--gold);margin-top:4px}
.reading{margin-top:16px;padding:18px;background:rgba(180,160,130,0.04);border-radius:var(--r);font-size:19px;line-height:1.9}
.reading h3{font-size:20px;color:var(--gold);margin-bottom:8px}

/* Bottom Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;
  border-top:1px solid rgba(180,160,130,0.12);z-index:100;padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.nav-item{flex:1;text-align:center;padding:8px 4px;cursor:pointer;transition:.2s;color:var(--text3);font-size:15px}
.nav-item .ni{font-size:28px;display:block;margin-bottom:2px}
.nav-item.on{color:var(--red)}

/* Pages */
.page{display:none}
.page.on{display:block}

/* Date nav */
.date-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.date-nav .arrow{font-size:24px;padding:8px 12px;cursor:pointer;color:var(--gold);border:none;background:none;font-family:inherit}
.date-nav .date-label{font-size:22px;font-weight:700;color:var(--red);min-width:180px;text-align:center}

/* Disclaimer */
.disc{text-align:center;color:var(--text3);font-size:15px;margin:24px 16px;line-height:1.7}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;
  padding:14px 28px;border-radius:var(--r2);font-size:18px;z-index:200;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* Face & Palm */
.face-upload-area{text-align:center;padding:28px 20px;border:2px dashed rgba(180,160,130,0.25);border-radius:var(--r2);margin:12px 0;cursor:pointer;transition:.2s}
.face-upload-area:active{border-color:var(--red);background:rgba(196,58,49,0.03)}
.face-upload-area .up-icon{font-size:2em;margin-bottom:8px}
.face-upload-area .up-text{font-size:18px;color:var(--text3)}
.face-svg{width:100%;max-width:280px;margin:0 auto;display:block}
.face-zone{cursor:pointer;transition:.3s;fill:transparent;stroke:rgba(196,58,49,0.08);stroke-width:1.5}
.face-zone.picked{fill:rgba(196,58,49,0.12);stroke:var(--red);stroke-width:2}
.face-zone.mole{fill:var(--red);stroke:var(--red);opacity:.7}
.face-label{fill:var(--text2);font-size:10px;pointer-events:none;text-anchor:middle}
.palm-svg{width:100%;max-width:280px;margin:0 auto;display:block}
.palm-line{fill:none;stroke:rgba(196,58,49,0.3);stroke-width:2.5;stroke-linecap:round}
.palm-line.lit{stroke:var(--red);stroke-width:3}
.popt{padding:12px 16px;margin:4px 0;background:rgba(196,58,49,0.04);border-radius:var(--r);cursor:pointer;font-size:17px;transition:.2s}
.popt.sel{background:rgba(196,58,49,0.12);border:1px solid var(--red);font-weight:600}
.popt:hover{background:rgba(196,58,49,0.08)}

/* Majing */
.horse-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.horse-card{background:rgba(196,58,49,0.03);border-radius:var(--r);padding:14px 12px;text-align:center;border:1px solid rgba(180,160,130,0.1);transition:.2s}
.horse-card.hot{border-color:var(--red);background:rgba(196,58,49,0.06)}
.horse-card.cold{border-color:var(--blue);background:rgba(91,122,138,0.05)}
.horse-card .h-no{font-size:14px;color:var(--text3)}
.horse-card .h-name{font-size:20px;font-weight:700;color:var(--text);margin:4px 0}
.horse-card .h-meta{font-size:15px;color:var(--text2)}
.horse-card .h-stars{color:var(--gold);font-size:16px;margin-top:4px}
.horse-card .h-odds{font-size:14px;color:var(--text3)}
.mj-tip{padding:16px;background:rgba(196,58,49,0.04);border-radius:var(--r);text-align:center;font-size:18px;color:var(--text);line-height:1.9;margin:12px 0;border:1px solid rgba(196,58,49,0.1)}
.mj-tip .big{font-size:22px;font-weight:700;color:var(--red);display:block;margin-bottom:4px}
.mj-round{text-align:center;padding:8px;margin-bottom:12px}
.mj-round select{max-width:200px;margin:0 auto;text-align:center;text-align-last:center}

/* Nav grid for 6 items */
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.nav-item{flex:none}

.ai-btn{background:linear-gradient(135deg,#667eea,#764ba2)!important;color:#fff!important;animation:pulse-glow 2s infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 8px rgba(102,126,234,0.4)}50%{box-shadow:0 0 20px rgba(118,75,162,0.6)}}
.ai-loading{text-align:center;padding:24px;color:var(--red)}
.ai-loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(196,58,49,0.15);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-error{background:rgba(196,58,49,0.06);border:1px solid var(--red);border-radius:var(--r);padding:16px;text-align:center;color:var(--red);font-size:16px}

</style>
</head>

<div class="header">
  <div class="brand">福 临 阁</div>
  <div class="sub">每日黄历 · 贴心常伴</div>

</div>

<!-- Page 1: 每日黄历 -->
<div class="page on" id="page-huangli">

    <div class="huangli-grid" id="hlGrid"></div>
    <div class="yi-ji" id="yiJi"></div>
    <div class="daily-tip" id="dailyTip"></div>
  </div>
</div>

<!-- Page 2: 生肖运势 -->
<div class="page" id="page-zodiac">

    <div class="zodiac-detail" id="zodiacDetail" style="display:none"></div>

<!-- Page 3: 八字简批 -->
<div class="page" id="page-bazi">

    <div class="card-title"><span class="icon">☯</span>八字简批</div>
    <div id="baziForm">
      <div class="fg"><label>出生日期</label>
        <div class="dr">
          <select id="baziYear" onchange="updateBDay()"><option value="">年</option></select>
          <select id="baziMonth" onchange="updateBDay()"><option value="">月</option></select>
          <select id="baziDay"><option value="">日</option></select>

      </div>

          <option value="-1">未指定</option><option value="0">子时 23-01</option><option value="1">丑时 01-03</option><option value="2">寅时 03-05</option><option value="3">卯时 05-07</option><option value="4">辰时 07-09</option><option value="5">巳时 09-11</option><option value="6" selected>午时 11-13</option><option value="7">未时 13-15</option><option value="8">申时 15-17</option><option value="9">酉时 17-19</option><option value="10">戌时 19-21</option><option value="11">亥时 21-23</option>
        </select>

      </div>

<!-- Page 4: 面相 -->
<div class="page" id="page-mianxiang">

      <div style="text-align:center;margin-top:8px"><button class="btn" style="background:var(--text3);color:#fff;padding:10px 24px;font-size:16px;width:auto;display:inline-block" onclick="retakeFacePhoto()">重新拍照</button>
      <button class="btn" style="background:var(--red);color:#fff;padding:10px 24px;font-size:16px;width:auto;display:inline-block;margin-left:8px" onclick="doMxRead()">生成面相报告</button></div>
    </div>
    <div id="mxResult" style="margin-top:12px"></div>
    <button class="btn btn-primary" onclick="doMxRead()" id="mxReadBtn" style="margin-top:8px;display:none">生成面相报告</button>
  </div>
</div>

<!-- Page 5: 手相 -->
<div class="page" id="page-shouxiang">
  <div class="card">
    <div class="card-title"><span class="icon">✋</span>手相解析</div>
    <div id="palmContainer"></div>
    <div id="palmUploadArea" class="face-upload-area" onclick="document.getElementById('palmPhotoInput').click()">
      <div class="up-icon">📸</div><div class="up-text">点击拍照上传手掌照片（可选）</div>
    </div>
    <input type="file" id="palmPhotoInput" accept="image/*" onchange="handlePalmPhoto(event)" style="display:none">
    <div id="palmPhotoWrap" style="display:none">
      <div style="position:relative"><img id="palmPhoto" style="width:100%;max-width:300px;margin:0 auto;display:block;border-radius:var(--r2)" alt=""><div id="palmSvgOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%"></div></div>
      <div style="text-align:center;margin-top:8px"><button class="btn" style="background:var(--text3);color:#fff;padding:10px 24px;font-size:16px;width:auto;display:inline-block" onclick="retakePalmPhoto()">重新拍照</button>
      <button class="btn ai-btn" id="aiPalmBtn" style="padding:10px 24px;font-size:16px;width:auto;display:none;margin-left:8px" onclick="aiReadPalm()">🤖 AI智能识别</button>
      <button class="btn" style="background:var(--red);color:#fff;padding:10px 24px;font-size:16px;width:auto;display:inline-block;margin-left:8px" onclick="doPalmRead()">生成手相报告</button></div>
    </div>
    <div class="palm-lines-picker" id="palmLinesPicker" style="margin-top:8px"></div>
    <button class="btn btn-primary" onclick="doPalmRead()" style="margin-top:8px">生成手相报告</button>
    <div id="sxResult" style="margin-top:12px"></div>
  </div>
</div>

<!-- Page 6: 马经 -->
<div class="page" id="page-majing">

function leapMonthDays(y){return lunarInfo[y-1900]&0x10000?30:29}
function monthDays(y,m){return lunarInfo[y-1900]&(0x10000>>m)?30:29}

function solar2Lunar(y,m,d){
  var base=new Date(1900,0,31),now=new Date(y,m-1,d);
  var offset=Math.floor((now-base)/86400000);
  var i,year,month,day,isLeap=false;
  for(i=1900;i<2100&&offset>0;i++){var dY=lunarYearDays(i);if(offset<dY)break;offset-=dY}
  year=i;
  var leap=leapMonth(i),leapM=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===leap+1&&!leapM){--i;leapM=true;var dL=leapMonthDays(year)}else{leapM=false;var dL=monthDays(year,i)}
    if(leapM&&i===leap+1)leapM=false;
    if(offset<dL)break;
    offset-=dL;
  }
  month=i;day=offset+1;
  return {y:year,m:month,d:day,leap:leapM,monthName:lunarMonthNames[month-1],dayName:lunarDayNames[day-1]};
}

var venues={hk:'沙田马场 (香港)',mc:'凼仔马场 (澳门)'};
var rounds={hk:[{n:'第1场 1000米',id:'R1'},{n:'第2场 1200米',id:'R2'},{n:'第3场 1400米',id:'R3'},{n:'第4场 1600米',id:'R4'},{n:'第5场 1800米',id:'R5'},{n:'第6场 2000米',id:'R6'},{n:'第7场 1200米',id:'R7'},{n:'第8场 1600米',id:'R8'}],mc:[{n:'第1场 1050米沙地',id:'R1'},{n:'第2场 1350米沙地',id:'R2'},{n:'第3场 1500米草地',id:'R3'},{n:'第4场 1800米草地',id:'R4'},{n:'第5场 1200米草地',id:'R5'}]};
var mjVenue='hk',mjRound=0;

function pickHorses(seed){
  var arr=horseDB.slice();
  // Shuffle based on seed
  for(var i=arr.length-1;i>0;i--){var j=((seed*(i+1))%10007)%(i+1);var t=arr[i];arr[i]=arr[j];arr[j]=t}
  return arr.slice(0,6);
}

function renderMijing(){
  var now=new Date();
  var seed=now.getFullYear()+now.getMonth()+now.getDate()+(mjVenue==='mc'?100:0)+mjRound*7;
  document.getElementById('mjVenue').textContent=(mjVenue==='hk'?'香港':'澳门')+' · 第'+(mjRound+1)+'场';
  document.getElementById('mjDate').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
  var picks=pickHorses(seed);
  var hotPicks=picks.filter(function(h){return h.style==='hot'});
  var coldPicks=picks.filter(function(h){return h.style==='cold'});
  var grid=document.getElementById('horseGrid');
  grid.innerHTML='';
  picks.forEach(function(h,i){
    var starCount=3+((seed+i)%3);
    var odds=((seed*h.no)%99+11)/10;
    grid.innerHTML+='<div class="horse-card'+h.style+'">'+
      '<div class="h-no">'+h.no+'号</div>'+
      '<div class="h-name">'+h.n+'</div>'+
      '<div class="h-meta">骑师:'+h.j+' | 练马师:'+h.t+'</div>'+
      '<div class="h-stars">'+Array(starCount+1).join('★')+'</div>'+
      '<div class="h-odds">参考赔率 '+odds.toFixed(1)+'</div>'+
      '</div>';
  });
  var strategies=[
    '贴士策略：热门马匹（红色框）状态正佳，可重点关注；冷门马匹（蓝色框）可能有惊喜，小注怡情。',
    '今日建议：前三位热门马匹（红框标记）实力较强，适合做胆拖组合；冷门马匹可做冷脚配搭。',
    '参考方向：以热门马为主力，冷门马为辅。今日场地状况良好，善跑前领的马匹占优。'
  ];
  document.getElementById('mjStrategy').innerHTML=
    '<span class="big">📋 今日贴士</span>'+
    (hotPicks.length>0?'<p>🔥 热门精选：'+hotPicks.map(function(h){return h.no+'号 '+h.n}).join('、')+'</p>':'')+
    (coldPicks.length>0?'<p>❄️ 冷门留意：'+coldPicks.map(function(h){return h.no+'号 '+h.n}).join('、')+'</p>':'')+
    '<p style="margin-top:8px">'+strategies[seed%3]+'</p>';
}

function initMijing(){
  var sel='<select id="mjVenueSel" onchange="changeMjVenue()"><option value="hk">沙田马场 (香港)</option><option value="mc">凼仔马场 (澳门)</option></select>';
  document.getElementById('mjRoundSel').innerHTML='📍 '+sel;
  var roundSel='<select id="mjRoundInput" onchange="changeMjRound()">';

function changeMjVenue(){

// ====== AI Palm Reading ======
async function aiReadPalm(){
  if(!_sxPhotoData){toast('请先上传手掌照片');return}
  
  var loading=document.getElementById('palmSvgOverlay');
  loading.innerHTML='<div class="ai-loading"><div class="spinner"></div><p>AI正在分析掌纹...</p><p style="font-size:14px;color:var(--text3)">通过本地引擎识别中...</p></div>';
  document.getElementById('aiPalmBtn').disabled=true;
  
  try{
    var imgData=_sxPhotoData.split(',')[1];
    var mime=_sxPhotoData.match(/data:(image\/\w+);/)[1]||'image/jpeg';
    var gwUrl='http://127.0.0.1:8790/v1/chat/completions';
    
    var resp=await fetch(gwUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'deepseek/deepseek-v4-pro',
        messages:[{
          role:'user',
          content:[
            {type:'text',text:'你是掌纹分析专家。请分析手掌照片，识别五条主要纹路返回SVG path的JSON。\n1.生命线:围绕拇指根部弧形\n2.智慧线:横穿掌心从食指下方\n3.感情线:智慧线上方小指下方\n4.命运线:手腕中央竖直向上至中指\n5.太阳线:无名指下方\n坐标适配300x340 viewBox，格式{"life":"M...","head":"M...","heart":"M...","fate":"M...","sun":"M..."}，只返回JSON不说其他。看不清的线设为空字符串。'},
            {type:'image_url',image_url:{url:'data:'+mime+';base64,'+imgData}}
          ]
        }],
        max_tokens:2000,
        temperature:0.1
      })
    });
    
    if(!resp.ok){var err=await resp.text();throw new Error('API ['+resp.status+']: '+err.substring(0,80))}
    var data=await resp.json();
    if(!data.choices||!data.choices[0])throw new Error('Gateway返回格式异常');
    var content=data.choices[0].message.content;
    
    var json=parsePalmAI(content);
    if(!json)throw new Error('AI未能识别出掌纹，请确保手掌清晰平展');
    
    applyAILines(json);
    updatePalmLinesAI(json);
    toast('AI掌纹识别完成 \u2713');
  }catch(e){
    console.error('AI Error:',e);
    var msg=e.message;
    if(msg.includes('Failed to fetch')||msg.includes('NetworkError')){
      msg='无法连接本地引擎\n请确认QClaw已启动（端口28789）';
    }
    document.getElementById('palmSvgOverlay').innerHTML='<div class="ai-error">识别失败：'+msg.replace(/\n/g,'<br>')+'</div>';
  }
  document.getElementById('aiPalmBtn').disabled=false;
}

function parsePalmAI(text){
  var jsonMatch=text.match(/\{[\s\S]*\}/);
  if(!jsonMatch)return null;
  try{return JSON.parse(jsonMatch[0])}catch(e){return null}
}

function applyAILines(json){
  var lines=['life','head','heart','fate','sun'];
  lines.forEach(function(k){
    if(json[k]){
      var el=document.getElementById('pl-'+k);
      if(el)el.setAttribute('d',json[k]);
    }
  });
  lines.forEach(function(k){
    var d=json[k]||'';
    if(d.length<10){palmLines[k]=2;return}
    var isLong=d.length>60;
    var hasWaves=d.includes('Q')&&d.split('Q').length>4;
    if(hasWaves)palmLines[k]=4;
    else if(isLong)palmLines[k]=0;
    else palmLines[k]=3;
  });
}

function updatePalmLinesAI(json){
  initPalmPicker();
  if(_sxPhotoData){document.getElementById('palmSvgOverlay').innerHTML=buildPalmSvg()}
}
