<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福临阁 · 诊断</title>
<style>body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f0e8;color:#3d3226;font-size:18px;padding:20px}
.card{background:#fffef9;border-radius:16px;padding:24px;margin:12px 0;box-shadow:0 2px 12px rgba(180,160,130,0.08)}
h2{color:#c43a31} .ok{color:#4a7c59} .err{color:#c43a31} pre{background:#faf5ed;padding:12px;border-radius:8px;font-size:14px;overflow-x:auto}</style></head><body>
<div class="card"><h2>福临阁 · 诊断</h2><p id="status">运行中...</p></div>
<div class="card"><h3>1. JS加载</h3><p id="test1">...</p></div>
<div class="card"><h3>2. renderAll()</h3><pre id="test2">...</pre></div>
<div class="card"><h3>3. populateBaZiSelects()</h3><pre id="test3">...</pre></div>
<div class="card"><h3>4. Browser Info</h3><pre id="test4">...</pre></div>
<script>
var log=[];
function add(id,msg,cls){log.push(msg);var e=document.getElementById(id);e.textContent=msg;e.className=cls||''}

// Step 0: basic JS
document.getElementById('test1').innerHTML='<span class="ok">OK: JS引擎正常</span>';

// Test 1: can we run basic ops?
add('test1','OK: JS引擎正常, const/let/function/for/forEach均可用','ok');

try {
  // Now try to load the full senior.js logic
  var fullJS=document.querySelector('script[data-senior]');
  if(fullJS) {
    eval(fullJS.textContent);
    add('test2','OK: 脚本加载成功, renderAll/doBazi 已定义','ok');
    
    try {
      renderAll();
      add('test3','OK: renderAll() 执行成功','ok');
    } catch(e) {
      add('test3','FAIL: renderAll() 报错: '+e.message,'err');
    }
    
    try {
      populateBaZiSelects();
    } catch(e) {
      add('test3',document.getElementById('test3').textContent + '\npopulateBaZiSelects() 报错: '+e.message,'err');
    }
  } else {
    add('test2','SKIP: 未找到data-senior脚本','');
  }
} catch(e) {
  add('test1','FAIL: 脚本解析失败: '+e.message,'err');
}

// Browser info
add('test4','UA: '+navigator.userAgent+'\nScreen: '+screen.width+'x'+screen.height+'\nOnline: '+navigator.onLine, 'ok');
</script></body></html>
