  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #d4a853;
    --gold-light: #f0d68a;
    --purple: #6b3fa0;
    --purple-dark: #1a0a2e;
    --blue-mystic: #16213e;
    --text-light: #e0d5f5;
  }

  body {
    font-family: 'ZCOOL XiaoWei', 'Ma Shan Zheng', serif;
    background: var(--purple-dark);
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text-light);
    cursor: default;
    user-select: none;
    -webkit-tap-highlight-color: transparent;

  /* ── Canvas Starfield ── */
  #starfield {

    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Ambient overlay ── */

    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at center, rgba(107,63,160,0.15) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: ambientPulse 8s ease-in-out infinite;
  }
  @keyframes ambientPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.05); }
  }

  /* ── Main container ── */
  #app {
    position: relative;
    z-index: 1;
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── Screen transitions ── */
  .screen {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    animation: fadeSlideIn 0.6s ease-out;
  }
  .screen.active { display: flex; }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }

    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 2px 8px rgba(212,168,83,0.4));
    letter-spacing: 4px;

  .subtitle {
    font-size: 0.85em;

    letter-spacing: 6px;
    margin-top: -4px;

    width: 100%;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;

    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(212,168,83,0.15), transparent);
    opacity: 0;
    transition: opacity 0.3s;

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let w, h;

function resizeCanvas() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initStars(count = 150) {
  stars = [];
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.3,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinkleOffset: Math.random() * Math.PI * 2,
      baseAlpha: Math.random() * 0.5 + 0.5,
      hue: Math.random() < 0.15 ? 40 + Math.random() * 20 : 260 + Math.random() * 40,
    });
  }
}
initStars();

function drawStars(timestamp) {
  ctx.clearRect(0, 0, w, h);
  for (const s of stars) {
    const alpha = s.baseAlpha + Math.sin(timestamp * s.twinkleSpeed + s.twinkleOffset) * 0.3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${s.hue}, 60%, 80%, ${alpha})`;
    ctx.fill();
    // Glow for bigger stars
    if (s.r > 1.2) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue}, 60%, 80%, ${alpha * 0.15})`;
      ctx.fill();
    }
  }
  requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

  star.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
  document.body.appendChild(star);
  setTimeout(() => star.remove(), 2000);
}
setInterval(() => {
  if (Math.random() < 0.3) spawnShootingStar();
}, 4000);

function playAmbient() {
  if (!soundEnabled || !audioCtx) return;
  stopAmbient();
  const now = audioCtx.currentTime;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.06, now + 2);

  // Create a mystical drone
  const osc1 = audioCtx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(130.81, now); // C3
  osc1.frequency.linearRampToValueAtTime(138.59, now + 4); // C#3
  osc1.frequency.linearRampToValueAtTime(130.81, now + 8);

  const osc2 = audioCtx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(196, now);
  osc2.frequency.linearRampToValueAtTime(207.65, now + 4);
  osc2.frequency.linearRampToValueAtTime(196, now + 8);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(400, now);

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + 8);
  osc2.stop(now + 8);

  ambientNode = { osc1, osc2, gain, filter, timeout: setTimeout(playAmbient, 7500) };
}

function stopAmbient() {
  if (ambientNode) {
    clearTimeout(ambientNode.timeout);
    try { ambientNode.osc1.stop(); } catch(e){}
    try { ambientNode.osc2.stop(); } catch(e){}
    ambientNode = null;
  }
}

function playChime() {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
  osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.5);
}

function playRevealSound() {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + i * 0.12);
    gain.gain.setValueAtTime(0.12, now + i * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + i * 0.12);
    osc.stop(now + i * 0.12 + 0.4);
  });
}

document.getElementById('soundBtn').addEventListener('click', () => {
  initAudio();
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  if (soundEnabled) {
    btn.textContent = '🔊';
    btn.style.borderColor = 'var(--gold-light)';
    playAmbient();
  } else {
    btn.textContent = '🔇';
    btn.style.borderColor = 'rgba(212,168,83,0.3)';
    stopAmbient();
  }
});

// First tap init audio
document.addEventListener('click', () => initAudio(), { once: true });

let currentZodiac = null;

function renderZodiacGrid() {
  const grid = document.getElementById('zodiacGrid');
  grid.innerHTML = zodiacs.map((z, i) => `
    <div class="zodiac-card" onclick="selectZodiac(${i})">
      <div class="zodiac-emoji">${z.emoji}</div>
      <div class="zodiac-name">${z.name}</div>
    </div>
  `).join('');
}

function selectZodiac(idx) {
  currentZodiac = zodiacs[idx];
  playChime();
  showScreen('fortune');
  resetCard();
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

function resetCard() {
  const card = document.getElementById('fortuneCard');
  card.classList.remove('flipped');
}

function flipAgain() {
  resetCard();
}

document.getElementById('cardBack').addEventListener('click', () => {
  if (!currentZodiac) return;
  const card = document.getElementById('fortuneCard');
  if (card.classList.contains('flipped')) return;

  generateFortune(currentZodiac);
  card.classList.add('flipped');
  playRevealSound();
});

function resetToPick() {

  showScreen('pick');
}
