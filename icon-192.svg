<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1240"/>
      <stop offset="100%" stop-color="#070510"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(200,166,74,0.15)"/>
      <stop offset="100%" stop-color="rgba(200,166,74,0)"/>
    </radialGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <circle cx="96" cy="96" r="75" fill="none" stroke="#c8a64a" stroke-width="1" opacity="0.25"/>
  <circle cx="96" cy="96" r="55" fill="none" stroke="#c8a64a" stroke-width="0.8" opacity="0.2" stroke-dasharray="6 8"/>
  <circle cx="96" cy="96" r="35" fill="none" stroke="#c8a64a" stroke-width="1.2" opacity="0.35"/>
  <circle cx="96" cy="96" r="8" fill="#c8a64a" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- Star rays -->
  <g opacity="0.5">
    <line x1="96" y1="96" x2="120" y2="50" stroke="#ede4d0" stroke-width="0.8"/>
    <line x1="96" y1="96" x2="142" y2="86" stroke="#ede4d0" stroke-width="0.6"/>
    <line x1="96" y1="96" x2="50" y2="60" stroke="#ede4d0" stroke-width="0.7"/>
    <line x1="96" y1="96" x2="60" y2="140" stroke="#ede4d0" stroke-width="0.6"/>
    <line x1="96" y1="96" x2="130" y2="130" stroke="#ede4d0" stroke-width="0.5"/>
  </g>
  <!-- Small stars -->
  <circle cx="42" cy="50" r="2.5" fill="#c8a64a" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="55" r="2" fill="#c8a64a" opacity="0.5">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="120" r="1.8" fill="#ede4d0" opacity="0.4"/>
  <circle cx="155" cy="130" r="2.2" fill="#c8a64a" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
