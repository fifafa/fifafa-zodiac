function goTab(name){

  var t=document.getElementById('tab-'+name);if(t)t.classList.add('on');
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on')});
  var ni=document.querySelector('.ni[onclick*="'+name+'"]');if(ni)ni.classList.add('on');
  window.scrollTo(0,0);

}

// ============ History ============
function saveHistory(type,data){
  try{var h=JSON.parse(localStorage.getItem('lalalin_hist')||'[]');h.unshift({type:type,data:data,ts:Date.now()});if(h.length>20)h=h.slice(0,20);localStorage.setItem('lalalin_hist',JSON.stringify(h))}catch(e){}
}
function renderHistory(){
  var h=JSON.parse(localStorage.getItem('lalalin_hist')||'[]');
  var el=document.getElementById('historyList');
  if(!h.length){el.innerHTML='<p style="text-align:center;color:var(--t3);padding:20px 0">'+T('hist-empty')+'<br><span style="font-size:0.8em">完成占卜后将自动保存</span></p>';return}
  var html='';h.forEach(function(item,i){
    var d=new Date(item.ts);var ds=d.getMonth()+1+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    var label=item.type==='bazi'?'八字命盘':item.type==='tarot'?'塔罗占卜':item.type==='love'?'缘分测试':'生肖运势';
    var sub=item.type==='bazi'?item.data.y+'/'+item.data.m+'/'+item.data.d:item.type==='tarot'?(item.data.card||'')+'':item.data||'';
    html+='<div class="hist-item"><div><div style="font-size:0.85em;color:var(--gold)">'+label+'</div><div style="font-size:0.72em;color:var(--t3)">'+ds+' · '+sub+'</div></div><span class="hist-del" onclick="delHist('+i+')">✕</span></div>';
  });

function setSpread(n,el){TSPREAD=n;document.querySelectorAll('.spread-opt').forEach(function(o){o.classList.remove('on')});el.classList.add('on')}

function drawTarot(){
  var cards=[];var used={};
  for(var i=0;i<TSPREAD;i++){
    var idx;do{idx=rnd(0,tarotDeck.length-1)}while(used[idx]&&TSPREAD<=tarotDeck.length);
    used[idx]=1;cards.push(tarotDeck[idx]);
  }
  CUR_TAROT=cards;
  var labels_zh=['过去','现在','未来'],labels_en=['Past','Present','Future'];
  var html='';
  if(cards.length===1){
    var c=cards[0];
    html='<div style="font-size:2.5em">'+c.e+'</div><div class="tfn">'+(LANG==='zh'?c.n_zh:c.n_en)+'</div><div class="tfm">'+(LANG==='zh'?c.m_zh:c.m_en)+'</div>';
  }else{
    html+='<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">';
    cards.forEach(function(c,i){
      var lb=LANG==='zh'?labels_zh[i]:labels_en[i];
      html+='<div style="flex:1;min-width:80px;text-align:center;background:rgba(20,10,40,0.5);border-radius:10px;padding:10px 6px"><div style="font-size:0.65em;color:var(--t3);margin-bottom:4px">'+lb+'</div><div style="font-size:2em">'+c.e+'</div><div style="font-size:0.75em;color:var(--gold)">'+(LANG==='zh'?c.n_zh:c.n_en)+'</div><div style="font-size:0.65em;color:var(--t2);margin-top:4px;line-height:1.4">'+(LANG==='zh'?c.m_zh:c.m_en)+'</div></div>';
    });
    html+='</div>';
  }
  document.getElementById('tarotFront').innerHTML=html;
  document.querySelector('.tcrd').classList.remove('flip');
  setTimeout(function(){document.querySelector('.tcrd').classList.add('flip')},100);
  // save to history
  var cardNames=cards.map(function(c){return LANG==='zh'?c.n_zh:c.n_en}).join(' + ');
  saveHistory('tarot',{card:cardNames,spread:TSPREAD});
  // show in tarot history
  var now=new Date();
  document.getElementById('tarotHistory').textContent='最近：'+cardNames+' ('+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')+')';
}
function flipTarot(){if(!CUR_TAROT||document.querySelector('.tcrd').classList.contains('flip'))drawTarot()}

}

    'l-z-title','l-z-sub','l-z-today','l-z-week','l-z-month',
    'l-b-title','l-b-sub','l-b-empty',
    'l-t-title','l-t-sub','l-t-desc','l-t-touch','l-t-again',
    'l-love-title','l-love-sub','l-love-u','l-love-t','l-love-check'];
  ids.forEach(function(id){var el=document.getElementById(id);if(el){if(el.tagName==='P')el.innerHTML=T(id.replace('l-',''));else el.textContent=T(id.replace('l-',''))}});
  // Nav
  document.querySelectorAll('#bn .ni span:last-child').forEach(function(s,i){
    var keys=['nav-home','nav-zodiac','nav-bazi','nav-tarot','nav-love'];
    s.textContent=T(keys[i]);
  });
}

function toggleLang(){
  LANG=LANG==='zh'?'en':'zh';
  document.getElementById('langBtn').textContent=LANG==='zh'?'中':'EN';
  document.getElementById('subttl').textContent=LANG==='zh'?'LALALIN · MYSTIC EAST':'拉拉林 · 东方秘境';
  refreshLabels();
  dailyCard();
  renderZodiacs();
  initLove();
  if(ZIDX>=0&&ZD_CACHE)renderZDetail(ZIDX,zDetails[ZD_CACHE.k]);
  if(USER)showBazi();
  document.getElementById('tarotHistory').textContent='';
  CUR_TAROT=null;
}

// ============ STARS BG ============
(function(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d'),pts=[];
  function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener('resize',rs);
  for(var i=0;i<80;i++)pts.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+0.2,a:Math.random()*2,sp:0.003+Math.random()*0.01});
  function dr(){ctx.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);
      var alpha=0.15+Math.abs(Math.sin(p.a+=p.sp))*0.35;
      ctx.fillStyle='rgba(220,190,160,'+alpha+')';ctx.fill()});
    requestAnimationFrame(dr)}dr();
})();
