function toggleMusic(){
  if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  musicOn=!musicOn;document.getElementById('musicBtn').style.color=musicOn?'var(--g2)':'';
  if(musicOn){
    if(musicNode){musicNode.stop();musicNode.disconnect()}
    try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=220;g.gain.value=0.03;o.connect(g);g.connect(audioCtx.destination);o.start();musicNode=o}catch(e){}
  }else{if(musicNode){musicNode.stop();musicNode.disconnect();musicNode=null}}
}
